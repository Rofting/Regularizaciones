name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Herramientas de documentos · Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-writer poppler-utils tesseract-ocr

      - name: Herramientas de documentos · Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install libreoffice-fresh poppler tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron instalar las herramientas de documentos" }
          "$env:ProgramFiles\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Dependencias de Python
        shell: bash
        run: |
          # antlr4 (dependencia de OmegaConf/RapidOCR) se distribuye como fuente.
          # Preparar sus herramientas evita el instalador aislado que falla
          # por permisos en el runner Windows.
          if ! {
            python -m pip install --upgrade pip setuptools wheel &&
            python -m pip install --no-build-isolation 'antlr4-python3-runtime==4.9.3' &&
            python -m pip install -r requirements.txt
          } > dependency-results.txt 2>&1; then
            cat dependency-results.txt
            python - <<'PY'
          from pathlib import Path
          lines = Path("dependency-results.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          message = "\n".join(lines[-40:]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Instalación de dependencias::" + message)
          PY
            exit 1
          fi
          cat dependency-results.txt

      - name: Comprobar LibreOffice real
        shell: bash
        run: |
          python -c "import shutil; assert shutil.which('soffice'), 'LibreOffice no está en el PATH'"
          if [ "$RUNNER_OS" = "Windows" ]; then
            soffice.com --version
          else
            soffice --version
          fi

      - name: Suite completa desde el checkout limpio
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Conservar resultado de pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pruebas-${{ matrix.os }}
          path: |
            dependency-results.txt
            test-results.txt
          if-no-files-found: ignore
          retention-days: 14
