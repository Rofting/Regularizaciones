name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Evitar bases de datos en el árbol publicado
        shell: bash
        run: |
          tracked=$(git ls-files '*.db' '*.sqlite' '*.sqlite3' '*.db-wal' '*.db-shm')
          if [ -n "$tracked" ]; then
            echo "No se deben publicar bases de datos en Git:"
            echo "$tracked"
            exit 1
          fi

      - name: Herramientas de documentos · Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libreoffice-calc libreoffice-writer poppler-utils tesseract-ocr

      - name: Herramientas de documentos · Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libreOffice = "$env:ProgramFiles\LibreOffice\program\soffice.com"
          if (-not (Test-Path $libreOffice) -and (Get-Command winget -ErrorAction SilentlyContinue)) {
            winget install --exact --id TheDocumentFoundation.LibreOffice --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          }
          if (-not (Test-Path $libreOffice)) {
            choco install libreoffice-still --yes --no-progress
          }
          if (-not (Test-Path $libreOffice)) { throw "No se pudo instalar LibreOffice" }
          choco install poppler tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudieron instalar Poppler y Tesseract" }
          "$env:ProgramFiles\LibreOffice\program" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # LibreOffice incluye python.exe en su carpeta de programa. Preparar el
      # Python de las pruebas después deja su intérprete primero en el PATH.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias de Python
        shell: bash
        run: |
          python -c "import sys; print(sys.executable); assert sys.version_info[:2] == (3, 12), 'Se necesita Python 3.12'; assert 'libreoffice' not in sys.executable.casefold(), 'Se está usando el Python interno de LibreOffice'"
          if ! {
            python -m pip install --upgrade pip &&
            python -m pip install -r requirements.txt
          } > dependency-results.txt 2>&1; then
            cat dependency-results.txt
            python - <<'PY'
          from pathlib import Path
          lines = Path("dependency-results.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          message = "\n".join(lines[-40:]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Instalación de dependencias::" + message)
          PY
            exit 1
          fi
          cat dependency-results.txt

      - name: Comprobar LibreOffice real
        shell: bash
        run: |
          python -c "import shutil; assert shutil.which('soffice'), 'LibreOffice no está en el PATH'"
          # Falla si la versión instalada es anterior a la mínima verificada.
          python scripts/comprobar_libreoffice.py

      - name: Suite completa desde el checkout limpio
        shell: bash
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: |
          set -o pipefail
          if ! python -m unittest discover -s tests -v 2>&1 | tee test-results.txt; then
            python - <<'PY'
          import re
          from pathlib import Path
          text = Path("test-results.txt").read_text(encoding="utf-8", errors="replace")
          failures = [part for part in re.split(r"\n={10,}\n", text) if part.startswith(("ERROR:", "FAIL:"))]
          for failure in failures or ["\n".join(text.splitlines()[-40:])]:
              message = "\n".join(line[:800] for line in failure.splitlines())[:5000]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Prueba fallida::" + message)
          PY
            exit 1
          fi

      - name: Conservar resultado de pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pruebas-${{ matrix.os }}
          path: |
            dependency-results.txt
            test-results.txt
          if-no-files-found: ignore
          retention-days: 14
